<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>Smart Masar - سمارت مسار</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages and static hosts
      // Redirects 404 paths to index.html preserving URL path
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: Arial, sans-serif; text-align: center; padding: 50px;">
      <h2>جاري تحويل المسار إلى سمارت مسار...</h2>
      <p>Redirecting to Smart Masar platform...</p>
    </div>
  </body>
</html>
